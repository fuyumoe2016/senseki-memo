<!doctype html><html lang="ja"><head><title>戦績詳細｜ふゆの戦績メモ</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1320"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203753,#0b1320 72%);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#f3f7ff}main{max-width:600px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 17px 30px}a{color:#96dcff;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:26px;margin:0}.card{background:linear-gradient(145deg,#1e3047,#132034);border:1px solid #39526d;padding:20px;border-radius:22px;margin:12px 0}button{font:inherit;color:#f3f7ff;background:#294560;border:1px solid #54718b;border-radius:13px;padding:12px;cursor:pointer}.muted{color:#a4b7cd}.symbols{font-size:26px;line-height:1.6;overflow-wrap:anywhere;min-height:125px}.win{color:#91d9ff}.loss{color:#f4a3c9}.tag{color:#b9c8dc;font-size:15px}.stats{border-top:1px solid #435976;padding-top:15px;display:flex;justify-content:space-between;font-size:20px;font-weight:750}.details{color:#aebdd0;line-height:1.9;margin-top:12px}.item{width:100%;display:block;text-align:left;margin:12px 0}.item strong{display:block;font-size:17px}.item small{color:#aebbd0}#preview{display:none;max-width:100%;border-radius:12px;margin-top:12px}</style></head><body><main><header><h1 id="dateTitle">戦績詳細</h1><a href="./history.html">← 履歴</a></header><p class="muted" id="subtitle"></p><section class="card"><div id="symbols" class="symbols"></div><div class="stats"><div id="total"></div><div id="rate"></div></div><div class="details"><div id="promotion"></div><div id="demotion"></div></div></section><button id="export">画像を書き出す</button> <button id="copy">コピー</button><p class="muted" id="message"></p><img id="preview" alt="書き出した戦績画像"><script src="./history.js" defer></script></main></body></html>
