<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1320"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="戦績メモ"><title>戦績メモ</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#f0f6ff;background:#0b1320}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -20%,#1e3654,#0b1320 65%)}main{max-width:580px;margin:auto;padding:calc(env(safe-area-inset-top) + 15px) 16px calc(env(safe-area-inset-bottom) + 22px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:22px;letter-spacing:.05em;margin:0}h2{font-size:15px;margin:0;font-weight:600}.muted,small{color:#9cafc4}.card{border:1px solid #30435a;border-radius:20px;background:linear-gradient(140deg,#1b2a3e,#101b2b);padding:18px;margin-bottom:13px;box-shadow:0 6px 26px #0003}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:26px;margin-top:8px}.stats .rate{color:#9bdcff}button,input{font:inherit}button{cursor:pointer;color:#ecf4fe;background:#26374e;border:1px solid #42566f;border-radius:12px;padding:10px 13px}button:active{transform:scale(.98)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{font-size:21px;font-weight:750;height:108px;border-radius:20px}.win{background:linear-gradient(145deg,#245d80,#133a57);border:1px solid #4da8dd}.loss{background:linear-gradient(145deg,#783e62,#4a2542);border:1px solid #bf6998}.icon{font-size:41px;display:block;line-height:1.1}.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag.selected{background:#467895;border-color:#88d7ff}.log{max-height:205px;overflow-y:auto;margin-top:14px}.logrow{display:flex;align-items:center;gap:10px;padding:10px 3px;border-bottom:1px solid #2d4156}.logrow .result{font-size:23px;width:29px;text-align:center}.logrow .meta{flex:1;font-size:13px;color:#a9bbcf}.logrow button{padding:5px 9px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.details .card{margin:0;font-size:13px}.details b{display:block;margin-top:9px;font-size:17px}input[type=date]{min-width:0;max-width:100%;padding:9px;color:#f0f6ff;border:1px solid #445d74;background:#1c2b3d;border-radius:10px}#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);background:#dbeeff;color:#15263a;border-radius:14px;padding:12px 16px;max-width:90%;display:none;z-index:10;text-align:center}#update{display:none;background:#315f7c;border:1px solid #8edaff;border-radius:13px;padding:12px;margin-bottom:12px}#update button{margin-left:10px;background:#cdefff;color:#14314d}footer{color:#8ea5be;text-align:center;font-size:11px;padding:15px}#history{display:none;margin-top:10px}.history-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #30435a}body{touch-action:manipulation}
</style></head><body><main><header><div><h1>戦績メモ</h1><small>Match Record</small></div><button id="historyBtn">日付別履歴</button></header><div id="update">新しいバージョンがあります。<button id="updateBtn">更新する</button></div><section class="card"><div class="flex"><h2>記録する日</h2><input type="date" id="day"></div><div class="stats" style="margin-top:18px"><div><small>対戦</small><b id="total">0</b></div><div><small>勝利</small><b id="wins">0</b></div><div><small>敗北</small><b id="losses">0</b></div><div><small>勝率</small><b class="rate" id="rate">0%</b></div></div></section><section class="actions"><button class="win" id="win"><span class="icon">○</span>勝ち</button><button class="loss" id="loss"><span class="icon">×</span>負け</button></section><section class="card" style="margin-top:13px"><div class="flex"><h2>直前の試合のタグ</h2><small>タップで切り替え</small></div><div class="tags"><button class="tag" id="promotion">昇格戦</button><button class="tag" id="demotion">降格戦</button></div></section><section class="card"><div class="flex"><h2>対戦ログ</h2><small id="count">0件</small></div><div class="log" id="log"></div><div class="toolbar"><button id="undo">↶ ひとつ戻す</button><button id="copy">⧉ 全記録をコピー</button></div></section><div class="details"><div class="card">昇格戦<b id="promotionStat">0戦 0勝 0敗</b></div><div class="card">降格戦<b id="demotionStat">0戦 0勝 0敗</b></div></div><section class="card" style="margin-top:13px"><div class="flex"><small>この端末に自動保存</small><small>v1.0.0</small></div><div class="toolbar"><button id="backup">バックアップ保存</button><button id="restore">バックアップ復元</button><input type="file" id="file" accept=".json,application/json" hidden></div><div id="history"></div></section><footer>©ふゆもえ</footer></main><div role="status" id="toast"></div><script src="./app.js" defer></script></body></html>
