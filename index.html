<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1320"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="〇✕勝敗メモ"><title>〇✕勝敗メモ</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#f0f6ff;background:#0b1320}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -18%,#253c59,#0b1320 68%);touch-action:manipulation}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#273a53;border:1px solid #455b76;border-radius:16px;padding:12px}button:active{transform:scale(.98)}header,.session-head,.summary-main,.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:25px}h1{font-size:clamp(23px,6vw,31px);letter-spacing:-.04em;margin:0;font-weight:800}h2{font-size:16px;margin:0}.copy-btn{background:#20354c;border-color:#54718c;white-space:nowrap;font-weight:700}.muted,.hint{color:#a7b7cb}.session-head{margin:0 0 14px}.date{font-size:18px;font-weight:650}.subdate{font-size:12px;margin-top:4px;color:#9bacc3}.history-btn{color:#8dd5ff;background:none;border:0;font-weight:750;padding:8px 0}.card{background:linear-gradient(140deg,#1c2d43,#111e30);border:1px solid #344a63;border-radius:23px;padding:19px;margin-bottom:13px;box-shadow:0 8px 28px #0003}.record{min-height:280px;display:flex;flex-direction:column;justify-content:space-between}.sequence{font-size:clamp(19px,4.8vw,27px);line-height:1.65;overflow-wrap:anywhere;letter-spacing:.025em;min-height:160px}.mark-win{color:#94d8fb}.mark-loss{color:#f4a1c7}.sequence .tag-inline{white-space:nowrap;font-size:.75em;color:#b8c9df;margin:0 3px}.summary{border-top:1px solid #43546a;padding-top:15px}.summary-main strong{font-size:clamp(22px,6vw,30px);white-space:nowrap}.summary-main .percent{font-size:clamp(22px,6vw,29px);color:#9bdcff}.summary-main small{font-size:12px;color:#b6c5d6}.substats{margin-top:12px;color:#b2c0d1;font-size:13px;line-height:1.9}.controls,.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px}.controls button{background:#213249;padding:15px 8px;font-weight:700}.actions button{height:154px;border-radius:24px;font-size:23px;font-weight:800}.actions .symbol{display:block;font-size:60px;line-height:1.05;font-weight:400;margin-bottom:7px}.win{background:linear-gradient(145deg,#256c90,#123c60);border:1px solid #54b2e1}.loss{background:linear-gradient(145deg,#864563,#512843);border:1px solid #d078a7}.tags button{background:#213249;font-weight:750;min-height:57px}.tags button.selected{background:#3c6e91;border-color:#96dafa}.tag-note{text-align:center;font-size:12px;margin:0 0 17px;color:#9eafc3}.new-btn{width:100%;border:1px solid #45647e;background:#25374f;color:#9bdcff;border-radius:45px;padding:19px;font-weight:800;margin-bottom:16px}.secondary{margin-top:8px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.toolbar button{font-size:13px;padding:10px}.history{display:none}.history.open{display:block}.history-item{width:100%;text-align:left;margin-top:8px;display:flex;justify-content:space-between;align-items:center}.history-item.active{border-color:#85d6ff}.detail-log{margin-top:10px;max-height:220px;overflow:auto}.logrow{display:flex;align-items:center;gap:9px;border-bottom:1px solid #34485f;padding:8px 0}.logrow .meta{flex:1;color:#b7c7d9;font-size:13px}.logrow button{padding:7px 10px;font-size:12px}.label-small{font-size:12px;color:#9aacbe}#update{display:none;background:#315f7c;padding:12px;border-radius:12px;margin-bottom:12px}#toast{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 24px);left:50%;transform:translateX(-50%);max-width:90%;background:#dbeeff;color:#142338;border-radius:14px;padding:12px 16px;text-align:center;z-index:10}footer{text-align:center;color:#8199b3;font-size:11px;padding:17px}
</style></head><body><main>
<header><h1>〇✕勝敗メモ</h1><button class="copy-btn" id="copy">▣ 全てコピー</button></header>
<div id="update">新しいバージョンがあります。<button id="updateBtn">更新する</button></div>
<div class="session-head"><div><div class="date" id="dateLabel"></div><div class="subdate" id="sessionLabel"></div></div><button class="history-btn" id="historyBtn">◴ 履歴</button></div>
<section class="card record"><div class="sequence" id="sequence" aria-label="対戦結果一覧"></div><div class="summary"><div class="summary-main"><strong id="totalText">0戦 0勝 0敗</strong><div><small>勝率 </small><strong class="percent" id="rate">0%</strong></div></div><div class="substats"><div id="promotionStat">昇格戦：0戦 0勝 0敗</div><div id="demotionStat">降格戦：0戦 0勝 0敗</div></div></div></section>
<div class="controls"><button id="undo">↶ 取り消す</button><button id="deleteOne">▤ 個別削除</button></div>
<div class="actions"><button class="win" id="win"><span class="symbol">〇</span>勝ち</button><button class="loss" id="loss"><span class="symbol">✕</span>負け</button></div>
<div class="controls tags"><button id="promotion">★ 昇格戦</button><button id="demotion">↓ 降格戦</button></div><p class="tag-note">昇格戦・降格戦は直前の試合に付きます</p>
<button class="new-btn" id="newSession">⊕ 新規記録開始</button>
<section class="card history" id="history"><h2>記録の履歴</h2><div id="historyItems"></div></section>
<section class="card secondary"><div class="flex"><h2>記録・バックアップ</h2><span class="label-small" id="version">β版</span></div><div class="toolbar"><button id="backup">バックアップ保存</button><button id="restore">バックアップ復元</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="detail-log" id="log" hidden></div></section>
<footer>この端末に自動保存 · ©ふゆもえ</footer></main><div id="toast" role="status"></div><script src="./app.js" defer></script><script src="./update-desk.js" defer></script></body></html>
